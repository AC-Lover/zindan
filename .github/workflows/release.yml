name: Release

on:
  push:
    tags:
      - 'v*-*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.6.1-270)'
        required: true
        default: 'v1.6.1-270'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION=$(echo "${TAG}" | sed 's/^v//' | sed 's/-[^-]*$//')
          if echo "${TAG}" | grep -q -- '-'; then
            CODE="${TAG##*-}"
          else
            CODE=$(grep "^VERSION_CODE=" version.properties 2>/dev/null | cut -d'=' -f2 || echo "270")
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "title=Zindan ${VERSION} (${CODE})" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pin version code from tag
        run: |
          CODE="${{ steps.meta.outputs.code }}"
          VERSION="${{ steps.meta.outputs.version }}"
          echo "Building versionCode ${CODE} (${VERSION})"
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${CODE}/" version.properties
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${VERSION}/" version.properties
          grep VERSION version.properties

      - name: Build APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Keystore secret detected, building signed Release APK..."
            echo "${KEYSTORE_BASE64}" | base64 -d > release.keystore
            export ZINDAN_KEYSTORE_PATH="release.keystore"
            export ZINDAN_KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD}"
            export ZINDAN_KEY_ALIAS="${KEY_ALIAS}"
            export ZINDAN_KEY_PASSWORD="${KEY_PASSWORD}"
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
            APK=$(ls app/build/outputs/apk/release/Zindan-*.apk 2>/dev/null | head -1)
          else
            echo "No keystore secret found, building Debug APK..."
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
            APK=$(ls app/build/outputs/apk/debug/Zindan-*.apk 2>/dev/null | head -1)
          fi

          if [ -z "${APK}" ] || [ ! -f "${APK}" ]; then
            echo "Error: APK build output not found!" >&2
            exit 1
          fi

          echo "APK generated at: ${APK}"
          echo "path=${APK}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${APK}")" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          chmod +x tools/extract_release_notes.sh || true
          if [ -f "tools/extract_release_notes.sh" ] && tools/extract_release_notes.sh "${{ steps.meta.outputs.tag }}" "${{ github.repository }}" > release-notes.md 2>/dev/null; then
            echo "Release notes written ($(wc -l < release-notes.md) lines)"
          else
            cat > release-notes.md <<EOF
          ## Zindan ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.code }})

          Release built from tag \`${{ steps.meta.outputs.tag }}\`.

          - VPN checking completely disabled/removed.
          EOF
          fi
          head -20 release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: release-notes.md
          files: ${{ steps.build.outputs.path }}
          make_latest: true
