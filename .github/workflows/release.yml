name: Release tag check

on:
  push:
    tags:
      - 'v*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.5.8-267)'
        required: true

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION=$(echo "${TAG}" | sed 's/^v//' | sed 's/-[^-]*$//')
          CODE="${TAG##*-}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.meta.outputs.tag }}

      - name: Verify version.properties
        run: |
          grep -qx "VERSION_NAME=${{ steps.meta.outputs.version }}" version.properties
          grep -qx "VERSION_CODE=${{ steps.meta.outputs.code }}" version.properties
          echo "Tag and version.properties match. Signed APK is published locally."
